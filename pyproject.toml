[project]
name = "seer-sufficiency"
version = "0.1.0"
description = "Seer sufficiency metrics pipeline"
requires-python = ">=3.11,<3.14"
readme = "README.md"

dependencies = [
  "datasets>=2.20.0",
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "scipy>=1.13.1",
  "scikit-learn>=1.5.1",
  "httpx>=0.27.0",
  "streamlit>=1.36.0",
  "matplotlib>=3.9.1",
  "transformers (>=4.42.4)",
  "torch>=2.4.0",
  "sentencepiece>=0.2.0",
  "sentence-transformers>=3.0.1",
  "ragas>=0.1.19",
  "ir_datasets>=0.5.8",
  "rank-bm25>=0.2.2",
  "rapidfuzz>=3.9.4",
  "pyyaml>=6.0.2",
  "dspy-ai (>=2.4.0)",
  "faiss-cpu>=1.7.4",
  "colbert-ai (>=0.2.22)",
  "huggingface-hub (>=0.36.0)",
  "dspy (==3.1.2)",
  "pytest==8.3.2",
  "pytest-asyncio==0.23.8",
]

[project.optional-dependencies]
dev = [
  "ruff==0.5.6",
]

[build-system]
requires = ["setuptools>=68.2.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seer*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
