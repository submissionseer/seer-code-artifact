# Jina raw-query baseline SFT + IPO — LoRA r=64
# Ablation against SEER-MR: same SFT adapter / IPO recipe, different IPO reward signal
# IPO pairs built from raw-query Jina scores (no decomposition), top-3 mean aggregation.

sft_adapter: /workspace/data/seer_sft/qlora-out-jina-mmr-5k-k3
train_data: /workspace/data/seer_sft/hotpot_dpo_raw_jina_maxmean_5k.jsonl
output_dir: /workspace/data/dpo_out/dpo-raw-jina-maxmean-5k-ipo-r64

loss_type: ipo
beta: 0.1
learning_rate: 5e-7
num_epochs: 2
warmup_steps: 150

lora_r: 64
lora_alpha: 128
lora_dropout: 0.05

micro_batch_size: 1
gradient_accumulation_steps: 8
max_length: 1536
max_prompt_length: 1280

wandb_project: huggingface
wandb_run_name: dpo-raw-jina-maxmean-5k-ipo-r64
save_steps: 500
eval_steps: 250
