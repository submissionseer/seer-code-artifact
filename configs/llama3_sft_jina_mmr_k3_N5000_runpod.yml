base_model: meta-llama/Meta-Llama-3-8B-Instruct
model_type: LlamaForCausalLM
tokenizer_type: AutoTokenizer
load_in_8bit: false
load_in_4bit: true
strict: false
wandb_project: "seer-experiment"
wandb_run_id: "llama3-8b-sft-jina-mmr-5k-k3"
wandb_watch: "all"
datasets:
  - path: /workspace/data/seer_sft/hotpot_train_sft_jina_mmr_k3_N5000.jsonl
    type: alpaca
val_set_size: 0.05
output_dir: /workspace/data/seer_sft/qlora-out-jina-mmr-5k-k3
adapter: lora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_linear: true
sequence_len: 2048
sample_packing: true
pad_to_sequence_len: true
gradient_accumulation_steps: 4
micro_batch_size: 2
num_epochs: 3
optimizer: paged_adamw_32bit
lr_scheduler: cosine
learning_rate: 0.0002
train_on_inputs: false
group_by_length: false
bf16: true
fp16: false
tf32: false
gradient_checkpointing: true
logging_steps: 1
flash_attention: true
warmup_steps: 10
special_tokens:
  pad_token: "<|end_of_text|>"
